[package]
name = "kms-grpc"
version.workspace = true
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true

[lib] # GRPC client and server for KMS
name = "kms_grpc"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[dependencies]
# ⚠️ IMPORTANT: Add new dependencies to workspace root Cargo.toml, NOT here!
# Use .workspace = true to reference workspace dependencies
# Maintain alphabetical order
alloy-dyn-abi = { workspace = true }
alloy-primitives = { workspace = true, features = ["k256"] }
alloy-sol-types = { workspace = true, features = ["eip712-serde"] }
anyhow.workspace = true
bc2wrap.workspace = true
cfg-if.workspace = true
hashing.workspace = true
hex.workspace = true
prost.workspace = true
rand = { workspace = true, features = ["std", "std_rng"] }
serde = { workspace = true, features = ["derive", "rc"] }
threshold-types.workspace = true
strum.workspace = true
strum_macros.workspace = true
thiserror.workspace = true
tonic = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }
tfhe = { workspace = true, features = [
    "boolean",
    "shortint",
    "integer",
    "zk-pok",
    "experimental-force_fft_algo_dif4",
] }
tfhe-versionable.workspace = true
tracing = { workspace = true, features = ["log"] }
wasm-bindgen.workspace = true
zeroize.workspace = true

[dev-dependencies]
# ⚠️ IMPORTANT: Add new dependencies to workspace root Cargo.toml, NOT here!
# Both are already workspace dependencies and are used only by the Solana linker vector
# generator/runner (tests/solana_linker_vectors.rs): serde_json reads and writes the committed
# normative vector set, and sha2 supplies the SHA-256 the set digest and the chain-id derivation
# rule are defined in terms of. The linker itself hashes with SHAKE-256 and does not use either.
serde_json.workspace = true
sha2.workspace = true

[build-dependencies]
tonic-prost-build.workspace = true

[package.metadata.cargo-machete]
ignored = ["prost", "tonic-prost", "wasm-bindgen"]

[features]
default = ["non-wasm"]
non-wasm = ["dep:tonic", "dep:tonic-prost"]
insecure = []
