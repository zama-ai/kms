[package]
name = "kms"
repository.workspace = true
description.workspace = true
version.workspace = true
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true

[lib] # Central KMS
name = "kms_lib"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[[bin]] # Bin to generate signing keys and TLS material
name = "kms-gen-keys"
path = "src/bin/kms-gen-keys.rs"

[[bin]] # Bin to generate TLS certificates for the service
name = "kms-gen-tls-certs"
path = "src/bin/kms-gen-tls-certs.rs"

[[bin]] # Bin to run the gRPC server
name = "kms-server"
path = "src/bin/kms-server.rs"

[[bin]] # Bin to initialize the threshold KMS cluster after all nodes are up and running.
name = "kms-init"
path = "src/bin/kms-init.rs"

[[bin]] # Bin for the custodians to generate keys and help in recovery
name = "kms-custodian"
path = "src/bin/kms-custodian.rs"

[dependencies]
# ⚠️ IMPORTANT: Add new dependencies to workspace root Cargo.toml, NOT here!
# Use .workspace = true to reference workspace dependencies
# Maintain alphabetical order
aes-gcm-siv.workspace = true
aes-gcm.workspace = true
aes-prng.workspace = true
aes08.workspace = true
algebra = { workspace= true }
alloy-dyn-abi.workspace = true
alloy-primitives = { workspace = true, features = ["k256"] }
alloy-signer-local.workspace = true
alloy-signer.workspace = true
alloy-sol-types = { workspace = true, features = ["eip712-serde"] }
anyhow.workspace = true
attestation-doc-validation = { workspace = true, optional = true}
aws-config = { workspace = true, optional = true }
aws-nitro-enclaves-nsm-api = { workspace = true, optional = true }
aws-sdk-kms = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
aws-smithy-types = { workspace = true, optional = true }
bc2wrap.workspace = true
bincode.workspace = true
bip39.workspace = true
cbc.workspace = true
cfg-if.workspace = true
ciborium.workspace = true
clap = { workspace = true, features = ["derive"] }
console_error_panic_hook.workspace = true
enum_dispatch.workspace = true
futures-util.workspace = true
hashing.workspace = true
hex.workspace = true
iam-rs = { workspace = true, optional = true }
itertools.workspace = true
k256.workspace = true
kms-grpc = { workspace = true, default-features = false }
ml-kem.workspace = true
nom.workspace = true
nsm-nitro-enclave-utils = { version = "0.1.2", features = ["pki"], optional = true }
observability = { workspace = true, optional = true }
p384.workspace = true
rand = { workspace = true, features = ["std", "std_rng"] }
rasn-cms.workspace = true
rasn.workspace = true
rayon.workspace = true
rcgen = { workspace = true, optional = true }
rsa.workspace = true
rustls-webpki = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde-wasm-bindgen.workspace = true
serde_json.workspace = true
signature.workspace = true
strum.workspace = true
strum_macros.workspace = true
# pid-liveness check for the startup sweep of orphaned partial-write files in
# vault/storage; already a production dependency via `observability`.
sysinfo = { workspace = true, optional = true }
tfhe = { workspace = true, features = [
    "boolean",
    "shortint",
    "integer",
    "zk-pok",
    "experimental-force_fft_algo_dif4",
    "extended-types",
] }
tfhe-csprng.workspace = true
tfhe-versionable.workspace = true
thiserror.workspace = true
thread-handles = { workspace = true, optional = true }
threshold-execution.workspace = true
threshold-networking = { workspace = true, optional = true }
threshold-types.workspace = true
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
], optional = true }
tokio-rustls = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tonic-health = { workspace = true, optional = true }
tonic-tls = { workspace = true, optional = true }
tower = { workspace = true, features = ["retry", "timeout"], optional = true }
tower-http = { workspace = true, features = ["trace"], optional = true }
test-utils = { workspace = true, optional = true }
tracing = { workspace = true, features = ["log"] }
trait-variant.workspace = true
url.workspace = true
validator.workspace = true
wasm-bindgen.workspace = true
x509-parser = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
zeroize.workspace = true

[dev-dependencies]
# ⚠️ IMPORTANT: Add new dependencies to workspace root Cargo.toml, NOT here!
# Use .workspace = true to reference workspace dependencies
# Maintain alphabetical order
assert_cmd.workspace = true
# In-process S3 mocking for the vault storage tests (replaces the MinIO integration setup).
aws-smithy-mocks = { workspace = true }
backward-compatibility = { workspace = true, features = ["load", "tests"] }
cargo_metadata = { workspace = true }
threshold-execution = { workspace = true, features = ["testing", "malicious_strategies"] }
# Self-import for integration tests
kms = { workspace = true, features = ["insecure", "testing"] }
# Peak-heap tracking for the `s3_store_peak_memory` bench, which measures how much memory one
# S3 store needs on top of the object being stored. Same global-allocator pattern the
# `core/experiments` memory benches already use; dev-only, so it never enters a shipped build.
peak_alloc = { workspace = true }
proptest.workspace = true
rstest.workspace = true
serde = { workspace = true, features = ["derive"] }
syn = { workspace = true }
tempfile.workspace = true
test-utils-service = { path = "./test-utils-service" }
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }
walkdir = { workspace = true }

# Everything else the bench needs (aws-sdk-s3, kms-grpc, tokio, tfhe) is already a dependency
# above and is visible to bench targets; `non-wasm` is what gates the optional ones.
[[bench]]
name = "s3_store_peak_memory"
harness = false
required-features = ["non-wasm"]


[features]
default = ["non-wasm"]
# `aws-sdk-s3?/test-util` is required by aws-smithy-mocks' `mock_client!`. The weak-dependency
# (`?`) syntax only enables it when aws-sdk-s3 is already pulled in (i.e. via `non-wasm`), so
# wasm / `--no-default-features` builds are unaffected and production never gets test-util.
testing = ["dep:tempfile", "threshold-execution/testing", "aws-sdk-s3?/test-util"]
non-wasm = [
    "kms-grpc/non-wasm",
    "threshold-execution/non-wasm",
    "dep:threshold-networking",
    "dep:attestation-doc-validation",
    "dep:aws-config",
    "dep:aws-nitro-enclaves-nsm-api",
    "dep:aws-sdk-kms",
    "dep:aws-sdk-s3",
    "dep:aws-smithy-types",
    "dep:iam-rs",
    "dep:observability",
    "dep:rustls-webpki",
    "dep:rcgen",
    "dep:sysinfo",
    "dep:tempfile",
    "dep:test-utils",
    "dep:thread-handles",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tokio-rustls",
    "dep:tonic",
    "dep:tonic-health",
    "dep:tonic-tls",
    "dep:tower",
    "dep:tower-http",
    "dep:x509-parser",
]
slow_tests = ["testing"]
wasm_tests = ["testing"]
insecure = [
    "kms-grpc/insecure",
    "threshold-networking/testing",
    "dep:nsm-nitro-enclave-utils",
    "threshold-execution/testing",
]
