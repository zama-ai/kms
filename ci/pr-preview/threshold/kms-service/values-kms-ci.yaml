kmsPeers:
  # Number of replicas managed by each statefulset
  count: 1

kmsCore:
  thresholdMode:
    enabled: true
    # peersList is generated dynamically by deploy.sh and should not be set here
    tls:
      enabled: true
  nitroEnclave:
    enabled: false
  resources:
    requests:
      # Compute runs in-container here (not in an enclave VM), so reserve a
      # large slice to force scheduling onto a big, ~exclusive node.
      memory: 32Gi
      cpu: 48
    limits:
      # Match the enclave VM's 96Gi ceiling (nitroEnclave.memoryGiB). NOTE: the
      # chart does not render a cpu limit, so CPU is bounded by node size only.
      memory: 96Gi
      ephemeralStorage: 10Gi
      grpcTimeout: 360
      grpcMaxMessageSize: 104857600
  publicVault:
    s3:
      enabled: true
      prefix:
  privateVault:
    s3:
      enabled: true
      prefix:
  storage:
    storageClassName: gp3
    capacity: 15Gi
  serviceMonitor:
    enabled: false
  nodeSelector:
    karpenter.sh/nodepool: kms-bench-spot-64
    # Pin the party nodes to the enclave node group's instance type (tkms-infra
    # enclaveNodeGroup.instanceType), so the non-enclave preview is the enclave
    # one minus the enclave and the vsock tunnel: 64 vCPU / 128 GiB, 25 Gbps
    # NIC, one party per node. Karpenter only honours this if the pool's
    # requirements allow the type — check with
    #   kubectl get nodepool kms-bench-spot-64 -o yaml
    # (instance-family / instance-size / capacity-type requirements); pods stay
    # Pending otherwise. Capacity type stays whatever the pool offers (spot).
    node.kubernetes.io/instance-type: c7a.16xlarge
  affinity:
    # One party per host, matching the enclave's podAntiAffinity.
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - kms-core
          topologyKey: kubernetes.io/hostname
  tolerations:
    - key: karpenter.sh/nodepool
      effect: NoSchedule
      operator: Equal
      value: kms-bench-spot-64
