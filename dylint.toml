[workspace.metadata.dylint]
libraries = [
    { git = "https://github.com/trailofbits/dylint", tag = "v6.0.4", pattern = "examples/general/non_local_effect_before_unhandled_error" },
    # The nightly toolchain + components needed to build this library are read
    # from `utils/tfhe-lints/rust-toolchain` in the tfhe-rs repo at the tag
    # below, and auto-installed by rustup on first `cargo dylint --all` run.
    { git = "https://github.com/zama-ai/tfhe-rs", tag = "tfhe-rs-1.8.1", pattern = "utils/tfhe-lints/lints" },
]

[non_local_effect_before_unhandled_error]
work_limit = 100000000
