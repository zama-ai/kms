name: Performance runner tests

on:
  pull_request:
    paths:
      - 'ci/scripts/**'
      - 'ci/perf-testing/**'
      - '.github/workflows/performance-testing.yml'
      - '.github/workflows/perf-tools-tests.yml'
  push:
    branches: [main]
    paths:
      - 'ci/scripts/**'
      - 'ci/perf-testing/**'
      - '.github/workflows/performance-testing.yml'
      - '.github/workflows/perf-tools-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Test runner orchestration and diagnostics
        run: python3 -m unittest discover -s ci/scripts/tests -v
      - name: Test workflow generation
        run: python3 ci/perf-testing/generate-perf-workflow.py --self-test
      - name: Test artifact analysis
        run: python3 ci/scripts/analyze_perf_run.py --self-test
