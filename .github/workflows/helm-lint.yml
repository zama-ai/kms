name: helm-lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: helm-lint/lint (bpr)
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Lint
        uses: WyriHaximus/github-action-helm3@fc4ba26e75cf5d08182c6ce3b72623c8bfd7272b # v3.1.0
        with:
          exec: helm lint charts/*

      - name: Install Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 #v4.2.0
        with:
          version: v3.16.4

      - name: Validate values.schema.json
        run: |
          set -euo pipefail
          helm lint charts/kms-core
          helm template test charts/kms-core >/dev/null
          helm template test charts/kms-core -f charts/kms-core/values-example-local.yaml >/dev/null
          helm template test charts/kms-core -f ci/pr-preview/centralized/kms-service/values-kms-ci.yaml >/dev/null
          helm template test charts/kms-core -f charts/kms-core/ci/values-schema-valid-legacy-prss-mask.yaml >/dev/null
          for invalid in charts/kms-core/ci/values-schema-invalid.yaml charts/kms-core/ci/values-schema-invalid-legacy-prss-mask.yaml charts/kms-core/ci/values-schema-invalid-missing-legacy-prss-mask.yaml; do
            if helm template test charts/kms-core -f "$invalid" >/dev/null 2>&1; then
              echo "expected schema validation to fail for $invalid" >&2
              exit 1
            fi
          done
          echo "invalid overlays were rejected as expected"
