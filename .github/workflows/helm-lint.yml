name: helm-lint

# Triggered for any change under charts/** on PRs and pushes to main/release/*.
on:
  pull_request:
    paths:
      - 'charts/**'
      - 'ci/**/kms-service/values*.yaml'
      - 'ci/kube-testing/kms/values*.yaml'
  push:
    branches: ['main', 'release/*']
    paths:
      - 'charts/**'
      - 'ci/**/kms-service/values*.yaml'
      - 'ci/kube-testing/kms/values*.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: helm-lint/lint (bpr)
    runs-on: 'ubuntu-latest'
    steps:
      # TODO: remove once GitHub runner images ship the CVE-2026-31431 kernel fix
      - name: Workaround CVE-2026-31431 (copy.fail)
        run: |
          echo "install algif_aead /bin/false" | sudo tee /etc/modprobe.d/disable-algif-aead.conf
          if lsmod | grep -q algif_aead; then
            sudo rmmod algif_aead || echo "WARNING: rmmod failed - module may be in use"
          elif modinfo algif_aead 2>/dev/null | grep -q builtin; then
            echo "WARNING: algif_aead built-in - modprobe.d blacklist has no effect"
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Lint
        uses: WyriHaximus/github-action-helm3@fc4ba26e75cf5d08182c6ce3b72623c8bfd7272b # v3.1.0
        with:
          exec: helm lint charts/*

      - name: Install Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 #v4.2.0
        with:
          version: v3.16.4

      - name: Validate values.schema.json
        run: |
          set -euo pipefail

          expect_invalid() {
            local name="$1"
            local expected="$2"
            shift 2
            if output=$(helm template test charts/kms-core "$@" 2>&1); then
              echo "expected schema validation to reject ${name}" >&2
              exit 1
            fi
            if ! grep -Fq "values don't meet the specifications of the schema(s)" <<<"$output" || ! grep -Eq "$expected" <<<"$output"; then
              printf '%s\n' "$output" >&2
              exit 1
            fi
            echo "rejected ${name} as expected"
          }

          jq empty charts/kms-core/values.schema.json
          helm lint charts/kms-core
          helm template test charts/kms-core >/dev/null
          helm template test charts/kms-core -f charts/kms-core/values-example-local.yaml >/dev/null
          helm template test charts/kms-core -f ci/pr-preview/centralized/kms-service/values-kms-ci.yaml >/dev/null
          helm template test charts/kms-core -f ci/pr-preview/centralizedWithEnclave/kms-service/values-kms-ci.yaml >/dev/null
          helm template test charts/kms-core -f ci/pr-preview/threshold/kms-service/values-kms-ci.yaml \
            --set kmsPeers.count=4 \
            --set kmsCore.thresholdMode.thresholdValue=1 >/dev/null

          overlay_count=0
          while IFS= read -r values_file; do
            helm template schema-check charts/kms-core -f "$values_file" \
              --set kmsCore.enabled=false \
              --set kmsCoreClient.enabled=false \
              --set kmsCoreClientTesting.enabled=false \
              --set kmsInit.enabled=false \
              --set kmsGenCertAndKeys.enabled=false \
              --set kmsGenKeys.enabled=false \
              --set kyverno.enabled=false >/dev/null
            ((overlay_count += 1))
          done < <(git ls-files 'ci/**/kms-service/values*.yaml' 'ci/kube-testing/kms/values*.yaml')
          echo "validated ${overlay_count} tracked values overlays"

          expect_invalid "invalid fixture" 'kmsPeers\.count|/kmsPeers/count' \
            -f charts/kms-core/ci/values-schema-invalid.yaml
          expect_invalid "zero peer count" 'kmsPeers\.count|/kmsPeers/count' \
            --set kmsPeers.count=0
          expect_invalid "out-of-range client port" 'ports[/.]client' \
            --set kmsCore.ports.client=65536
          expect_invalid "invalid pull policy" 'pullPolicy' \
            --set kmsCore.image.pullPolicy=Sometimes
          expect_invalid "odd enclave CPU count" 'cpuCount' \
            --set kmsCore.nitroEnclave.cpuCount=3
          expect_invalid "incomplete explicit peer" 'port' \
            --set-json 'kmsCore.thresholdMode.peersList=[{"id":1,"host":"kms-core-1"}]'
          expect_invalid "zero gRPC timeout" 'grpcTimeout' \
            --set kmsCore.resources.limits.grpcTimeout=0
          expect_invalid "oversized gRPC message limit" 'grpcMaxMessageSize' \
            --set kmsCore.resources.limits.grpcMaxMessageSize=2147483648
          expect_invalid "zero rate-limit bucket" 'bucketSize' \
            --set kmsCore.rateLimiter.bucketSize=0
          expect_invalid "zero telemetry refresh interval" 'refreshIntervalMs' \
            --set kmsCore.thresholdMode.refreshIntervalMs=0
          expect_invalid "zero threshold" 'thresholdValue' \
            --set kmsCore.thresholdMode.thresholdValue=0
          expect_invalid "oversized preprocessing session count" 'numSessionsPreproc' \
            --set kmsCore.thresholdMode.numSessionsPreproc=65536
          expect_invalid "non-positive network tunnel queue count" 'queueCount' \
            --set kmsCore.nitroEnclave.networkTunnel.queueCount=0
          expect_invalid "empty tracing endpoint" 'endpoint' \
            --set tracing.enabled=true --set-string tracing.endpoint=
          expect_invalid "empty enclave signing key" 'eifSignKey' \
            --set kmsCore.nitroEnclave.signed=true --set-string kmsCore.nitroEnclave.eifSignKey=
          expect_invalid "invalid AWS KMS key spec" 'rootKeySpec' \
            --set kmsCore.privateVault.awskms.enabled=true \
            --set kmsCore.privateVault.awskms.rootKeySpec=invalid
          expect_invalid "invalid Kubernetes resource quantity" 'cpu' \
            --set-string kmsCore.resources.requests.cpu=invalid
          expect_invalid "empty migration epoch list" 'epochIds' \
            --set-json 'kmsCore.migration.contextAssociations=[{"contextId":"0x0700000000000000000000000000000000000000000000000000000000000001","epochIds":[]}]'

          if output=$(helm template test charts/kms-core \
            --set kmsCore.thresholdMode.enabled=true \
            --set kmsPeers.count=4 \
            --set kmsCore.thresholdMode.thresholdValue=2 2>&1); then
            echo "expected invalid threshold topology to fail" >&2
            exit 1
          fi
          grep -Fq "threshold mode requires 3*t+1 parties" <<<"$output"
