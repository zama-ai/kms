name: helm-lint

# Triggered for any change under charts/** on PRs and pushes to main/release/*.
on:
  pull_request:
    paths:
      - 'charts/**'
  push:
    branches: ['main', 'release/*']
    paths:
      - 'charts/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: helm-lint/lint (bpr)
    runs-on: 'ubuntu-latest'
    steps:
      # TODO: remove once GitHub runner images ship the CVE-2026-31431 kernel fix
      - name: Workaround CVE-2026-31431 (copy.fail)
        run: |
          echo "install algif_aead /bin/false" | sudo tee /etc/modprobe.d/disable-algif-aead.conf
          if lsmod | grep -q algif_aead; then
            sudo rmmod algif_aead || echo "WARNING: rmmod failed - module may be in use"
          elif modinfo algif_aead 2>/dev/null | grep -q builtin; then
            echo "WARNING: algif_aead built-in - modprobe.d blacklist has no effect"
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Lint
        uses: WyriHaximus/github-action-helm3@fc4ba26e75cf5d08182c6ce3b72623c8bfd7272b # v3.1.0
        with:
          exec: helm lint charts/*

      - name: Install Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 #v4.2.0
        with:
          version: v3.16.4

      - name: Validate values.schema.json
        run: |
          set -euo pipefail
          helm lint charts/kms-core
          helm template test charts/kms-core >/dev/null
          helm template test charts/kms-core -f charts/kms-core/values-example-local.yaml >/dev/null
          helm template test charts/kms-core -f ci/pr-preview/centralized/kms-service/values-kms-ci.yaml >/dev/null
          if helm template test charts/kms-core -f charts/kms-core/ci/values-schema-invalid.yaml >/dev/null 2>&1; then
            echo "expected schema validation to fail for charts/kms-core/ci/values-schema-invalid.yaml" >&2
            exit 1
          fi
          echo "invalid overlay was rejected as expected"
