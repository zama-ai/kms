name: kms-nightly

on:
  workflow_dispatch:
    inputs:
      partition:
        description: 'Nightly partition to run'
        type: choice
        default: 'all'
        options: ['all', '1', '2', '3', '4', '5']
      timeout-probe:
        description: 'Enable computation and network deadline diagnostics'
        type: boolean
        default: false
      prss-pool-experiment:
        description: 'Run the PRSS pool comparison, then 13-party concurrent keygen'
        type: boolean
        default: false
  workflow_call:
    secrets:
      SLACK_CHANNEL:
        required: true
      BOT_USERNAME:
        required: true
      SLACK_WEBHOOK:
        required: true
      CGR_USERNAME:
        required: true
      CGR_PASSWORD:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  prss-pool-experiment:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.prss-pool-experiment }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/prss-pool-experiment.yml

  generate-test-material:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.prss-pool-experiment) }}
    name: kms-nightly/generate-test-material
    permissions:
      checks: write # Required to write to the GitHub Actions check suite
      packages: read # Required to read from the GitHub Packages registry
      issues: write # Required to write to the GitHub Issues API
      pull-requests: write # Required to write to the GitHub Pull Requests API
      actions: read # Required to read the GitHub Actions API
      contents: read # Required to read the GitHub Contents API
    uses: ./.github/workflows/generate-test-material.yml

  kms-nightly:
    name: kms-nightly/p${{ matrix.partition }}
    needs: [generate-test-material]
    permissions:
      checks: write # Required to write to the GitHub Actions check suite
      packages: read # Required to read from the GitHub Packages registry
      issues: write # Required to write to the GitHub Issues API
      pull-requests: write # Required to write to the GitHub Pull Requests API
      actions: read # Required to read the GitHub Actions API
      contents: read # Required to read the GitHub Contents API
    strategy:
      fail-fast: false
      matrix:
        partition: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.partition != 'all' && inputs.partition != '' && format('[{0}]', inputs.partition) || '[1,2,3,4,5]') }}
    uses: ./.github/workflows/common-testing.yml
    with:
      crate-names: '-p kms'
      args-tests: '-F slow_tests -F insecure --partition count:${{ matrix.partition }}/5 --lib -E test(/::nightly_/)'
      efs-test-material-path: ${{ needs.generate-test-material.outputs.efs-test-material-path }}
      lfs: true
      runs-on: '64cpu-linux-x64'
      runner-volume: '400gb'
      rust-log-level: ${{ github.event_name == 'workflow_dispatch' && inputs.timeout-probe && 'info,kms_timeout_probe=debug' || 'info' }}
      nextest-test-threads: '4'
    secrets:
      SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
      BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      CGR_USERNAME: ${{ secrets.CGR_USERNAME }}
      CGR_PASSWORD: ${{ secrets.CGR_PASSWORD }}
