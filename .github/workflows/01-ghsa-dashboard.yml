# 01-ghsa-dashboard — GHSA dashboard + cross-reference validation caller.
#
# NOTE FOR kms MAINTAINERS: this file exists in public kms ONLY so it survives the
# one-way `git push -f` sync (sync-on-push.yml) into the private internal repository
# It is intentionally INERT here: the single job is gated with `if: github.repository 
# != 'zama-ai/kms'`, so it does nothing in public kms and runs only inside the private
# mirror, where it uses that repo's own GITHUB_TOKEN to update a private tracking 
# issue. The gate names only the public repo (already referenced as public_repo below);
# it reveals nothing about the mirror.
#
# No sensitive values are hard-coded: the target internal repo is resolved at runtime
# via ${{ github.repository }} (never named here), matching how the sync itself keeps
# the destination in a secret. Owned by the Security Team.

name: 01-ghsa-dashboard

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      job_validate_dryrun:
        description: 'GHSA Validate dry-run (no writes)'
        required: false
        type: boolean
        default: false
      job_validate_since:
        description: 'GHSA Validate since YYYY-MM-DD (blank = all)'
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: ghsa-dashboard
  cancel-in-progress: true

jobs:
  ghsa-dashboard:
    # Run everywhere except public kms (i.e. only inside the private mirror).
    # References only the public repo — reveals nothing about the mirror's name.
    if: ${{ github.repository != 'zama-ai/kms' }}
    uses: zama-ai/ai-security/.github/workflows/ghsa-dashboard-reusable.yml@main
    with:
      public_repo: zama-ai/kms
      internal_repo: ${{ github.repository }}
      index_label: ghsa-index
      validate_dryrun: ${{ inputs.job_validate_dryrun || false }}
      validate_since: ${{ inputs.job_validate_since || '' }}
    secrets:
      GHSA_DASHBOARD_TOKEN: ${{ secrets.GHSA_DASHBOARD_TOKEN }}
