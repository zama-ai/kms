name: docker-build

on:
  #=======================================================
  release:
    types: [published]
  #=======================================================
  # Manual trigger from the GitHub UI. The "Use workflow from" dropdown lets
  # users pick a branch or tag; commit SHAs can be passed via
  # `gh workflow run docker-build.yml --ref <sha>`.
  # Each image can be toggled; unticking a parent also skips its dependents.
  workflow_dispatch:
    inputs:
      build-golden-image:
        description: 'Build rust-golden-image (parent of core-client, core-service, enclave)'
        type: boolean
        default: true
      build-core-client:
        description: 'Build core-client (needs golden-image and kms-binaries)'
        type: boolean
        default: true
      build-core-service:
        description: 'Build core-service (needs golden-image and kms-binaries; parent of enclave)'
        type: boolean
        default: true
      build-enclave:
        description: 'Build core-service-enclave (needs core-service)'
        type: boolean
        default: true
  #=======================================================
  workflow_call:
    inputs:
      build-golden-image:
        description: 'Build rust-golden-image (parent of core-client, core-service, enclave)'
        type: boolean
        default: true
      build-core-client:
        description: 'Build core-client (needs golden-image and kms-binaries)'
        type: boolean
        default: true
      build-core-service:
        description: 'Build core-service (needs golden-image and kms-binaries; parent of enclave)'
        type: boolean
        default: true
      build-enclave:
        description: 'Build core-service-enclave (needs core-service)'
        type: boolean
        default: true
    secrets:
      BLOCKCHAIN_ACTIONS_TOKEN:
        required: true
      AWS_ACCESS_KEY_S3_USER:
        required: true
      AWS_SECRET_KEY_S3_USER:
        required: true
      CGR_USERNAME:
        required: true
      CGR_PASSWORD:
        required: true
    outputs:
      image_tag:
        description: 'Docker Tag for the core-service / core-client images (per-commit SHA)'
        value: '${{ jobs.kms-binaries.outputs.image_tag }}'
      enclave_pcr0:
        description: 'Insecure test enclave PCR0 generated by this task'
        value: '${{ jobs.enclave-insecure.outputs.enclave_pcr0 }}'
      enclave_pcr1:
        description: 'Insecure test enclave PCR1 generated by this task'
        value: '${{ jobs.enclave-insecure.outputs.enclave_pcr1 }}'
      enclave_pcr2:
        description: 'Insecure test enclave PCR2 generated by this task'
        value: '${{ jobs.enclave-insecure.outputs.enclave_pcr2 }}'


permissions: {}

concurrency:
  # Scope concurrency to source branch (+ head repo for forks), so different PRs
  # can build in parallel while newer pushes on the same branch cancel older runs.
  group: docker-build-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name || github.run_id }}
  cancel-in-progress: true

jobs:
  ############################################################################
  # Computes a content-addressed tag for the golden image and checks whether
  # an image with that tag already exists in GHCR. The tag is derived from
  # the inputs that actually determine the image content: the Dockerfile,
  # rust-toolchain.toml, and the resolved digest of the Chainguard base
  # image (which is a moving tag upstream). When `cache_hit == 'true'`, the
  # content-tagged image already exists and can be retagged as `latest` before
  # the downstream Dockerfiles consume their existing `rust-golden-image:latest`
  # base.
  golden-image-tag:
    name: docker-build/golden-image-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read   # Required to checkout repository code
      packages: read   # Required to inspect manifests on GHCR
    outputs:
      golden_tag: ${{ steps.compute.outputs.golden_tag }}
      cache_hit: ${{ steps.lookup.outputs.cache_hit }}
    steps:
      - name: KMS Docker image tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_HASH: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${EVENT_NAME}" == "release" ]]; then
            TAG="${REF_NAME}"
          elif [[ "${EVENT_NAME}" == "schedule" ]]; then
            TAG="nightly-${COMMIT_HASH:0:7}"
          else
            TAG="${COMMIT_HASH:0:7}"
          fi

          echo "::notice title=KMS Docker image tag::core=${TAG}, core-client=${TAG}"
          echo ""
          echo "============================================================"
          echo "KMS DOCKER IMAGE TAG"
          echo "============================================================"
          echo "KMS Core image tag:        ${TAG}"
          echo "KMS Core client image tag: ${TAG}"
          echo ""
          echo "Perf rerun fields:"
          echo "  Build new Docker images: unchecked"
          echo "  KMS Core image tag: ${TAG}"
          echo "  KMS Core client image tag: ${TAG}"
          echo "============================================================"

          {
            echo "## KMS Docker image tag"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| KMS Core image tag | \`${TAG}\` |"
            echo "| KMS Core client image tag | \`${TAG}\` |"
            echo ""
            echo "For a perf rerun without rebuilding, uncheck \`Build new Docker images\` and use the tags above."
          } >> "$GITHUB_STEP_SUMMARY"

      # TODO: remove once GitHub runner images ship the CVE-2026-31431 kernel fix
      - name: Workaround CVE-2026-31431 (copy.fail)
        run: |
          echo "install algif_aead /bin/false" | sudo tee /etc/modprobe.d/disable-algif-aead.conf
          if lsmod | grep -q algif_aead; then
            sudo rmmod algif_aead || echo "WARNING: rmmod failed - module may be in use"
          elif modinfo algif_aead 2>/dev/null | grep -q builtin; then
            echo "WARNING: algif_aead built-in - modprobe.d blacklist has no effect"
          fi

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Login to Chainguard Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: cgr.dev
          username: ${{ secrets.CGR_USERNAME }} # zizmor: ignore[secrets-outside-env] CGR creds are shared by docker-build workflows.
          password: ${{ secrets.CGR_PASSWORD }} # zizmor: ignore[secrets-outside-env] CGR creds are shared by docker-build workflows.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute content hash
        id: compute
        run: |
          set -euo pipefail
          DOCKERFILE="docker/base/Dockerfile"
          # Single source of truth: read the first external FROM line from the
          # Dockerfile so bumping the base image there is enough to trigger a
          # golden image rebuild. Skips any `--flag=...` arguments to FROM.
          BASE_IMAGE=$(awk '
            toupper($1) == "FROM" {
              for (i = 2; i <= NF; i++) {
                if ($i !~ /^--/) { print $i; exit }
              }
            }
          ' "${DOCKERFILE}")
          if [[ -z "${BASE_IMAGE}" ]]; then
            echo "Failed to parse base image from ${DOCKERFILE}" >&2
            exit 1
          fi
          BASE_DIGEST=$(docker buildx imagetools inspect "${BASE_IMAGE}" --format '{{.Manifest.Digest}}')
          echo "Resolved ${BASE_IMAGE} -> ${BASE_DIGEST}"
          CONTENT_HASH=$(
            {
              echo "base=${BASE_DIGEST}"
              cat "${DOCKERFILE}" rust-toolchain.toml
            } | sha256sum | cut -c1-12
          )
          GOLDEN_TAG="golden-${CONTENT_HASH}"
          echo "golden_tag=${GOLDEN_TAG}" >> "$GITHUB_OUTPUT"
          echo "Computed golden image tag: ${GOLDEN_TAG}"
      - name: Check whether golden image already exists
        id: lookup
        env:
          GOLDEN_TAG: ${{ steps.compute.outputs.golden_tag }}
        run: |
          set -euo pipefail
          GOLDEN_IMAGE="ghcr.io/zama-ai/kms/rust-golden-image:${GOLDEN_TAG}"

          if docker manifest inspect "${GOLDEN_IMAGE}" >/dev/null 2>&1; then
            echo "cache_hit=true" >> "$GITHUB_OUTPUT"
            echo "Cache hit: ${GOLDEN_IMAGE} already exists."
          else
            echo "cache_hit=false" >> "$GITHUB_OUTPUT"
            echo "Cache miss: golden image will be built and pushed as :${GOLDEN_TAG}."
          fi

  ############################################################################
  # Builds Docker image for base Rust Golden Image
  #
  # Skipped entirely when `golden-image-tag` reports a cache hit, so that we
  # only rebuild the golden image when its content actually changes.
  golden-image:
    name: docker-build/golden-image (bpr)
    needs: [golden-image-tag]
    if: |
      (github.event_name != 'workflow_dispatch' || inputs.build-golden-image) &&
      needs.golden-image-tag.outputs.cache_hit != 'true'
    uses: zama-ai/ci-templates/.github/workflows/common-docker.yml@d13c806c229167a30eab20c228b87467d0e2e470 # v1.0.12
    permissions:
      actions: read # Required to read workflow run information
      contents: read # Required to checkout repository code
      id-token: write # Required for OIDC authentication
      pull-requests: read # Required to read pull request information
      packages: write # Required to publish Docker images
      attestations: write # Required to create build attestations
    with:
      docker-file: './docker/base/Dockerfile'
      working-directory: './base'
      push_image: true
      image-name: 'kms/rust-golden-image'
      app-cache-dir: 'kms-base'
      use-cgr-secrets: true
      # runs-on-amd: ${{ needs.start-amd64-runner.outputs.label }}
      runs-on-amd: "runs-on=${{ github.run_id }}/runner=64cpu-linux-x64/spot=false/volume=200gb/extras=s3-cache"
      rust-toolchain-file-path: rust-toolchain.toml
      image-tag: ${{ needs.golden-image-tag.outputs.golden_tag }}
    secrets:
      BLOCKCHAIN_ACTIONS_TOKEN: ${{ secrets.BLOCKCHAIN_ACTIONS_TOKEN }}
      AWS_ACCESS_KEY_S3_USER: ${{ secrets.AWS_ACCESS_KEY_S3_USER }}
      AWS_SECRET_KEY_S3_USER: ${{ secrets.AWS_SECRET_KEY_S3_USER }}
      CGR_USERNAME: ${{ secrets.CGR_USERNAME }}
      CGR_PASSWORD: ${{ secrets.CGR_PASSWORD }}

  ############################################################################
  # Retags the content-addressed golden image as latest.
  #
  # The downstream Dockerfiles cannot receive the content tag through
  # common-docker.yml@v1.0.5, so keep `latest` synchronized before they build.
  ############################################################################
  golden-image-latest:
    name: docker-build/golden-image-latest
    runs-on: ubuntu-latest
    # `rust-golden-image:latest` is a shared mutable tag across branches.
    # Serialize only this retag job globally to avoid cross-PR races while
    # keeping the rest of the workflow parallelized per branch.
    concurrency:
      group: docker-build-golden-image-latest-global
      cancel-in-progress: false
    needs:
      - golden-image-tag
      - golden-image
    if: |
      !cancelled() &&
      needs.golden-image-tag.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.build-golden-image) &&
      (
        needs.golden-image.result == 'success' ||
        needs.golden-image-tag.outputs.cache_hit == 'true'
      )
    permissions:
      packages: write # Required to update the latest tag in GHCR
    steps:
      # TODO: remove once GitHub runner images ship the CVE-2026-31431 kernel fix
      - name: Workaround CVE-2026-31431 (copy.fail)
        run: |
          echo "install algif_aead /bin/false" | sudo tee /etc/modprobe.d/disable-algif-aead.conf
          if lsmod | grep -q algif_aead; then
            sudo rmmod algif_aead || echo "WARNING: rmmod failed - module may be in use"
          elif modinfo algif_aead 2>/dev/null | grep -q builtin; then
            echo "WARNING: algif_aead built-in - modprobe.d blacklist has no effect"
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag golden image as latest
        env:
          GOLDEN_TAG: ${{ needs.golden-image-tag.outputs.golden_tag }}
        run: |
          set -euo pipefail
          GOLDEN_IMAGE="ghcr.io/zama-ai/kms/rust-golden-image:${GOLDEN_TAG}"
          LATEST_IMAGE="ghcr.io/zama-ai/kms/rust-golden-image:latest"

          docker buildx imagetools create \
            --tag "${LATEST_IMAGE}" \
            "${GOLDEN_IMAGE}"

          GOLDEN_DIGEST=$(docker buildx imagetools inspect "${GOLDEN_IMAGE}" --format '{{.Manifest.Digest}}')
          LATEST_DIGEST=$(docker buildx imagetools inspect "${LATEST_IMAGE}" --format '{{.Manifest.Digest}}')
          echo "${GOLDEN_IMAGE} -> ${GOLDEN_DIGEST}"
          echo "${LATEST_IMAGE} -> ${LATEST_DIGEST}"

          if [[ "${GOLDEN_DIGEST}" != "${LATEST_DIGEST}" ]]; then
            echo "Latest tag does not match ${GOLDEN_TAG} after retagging"
            exit 1
          fi

  ############################################################################
  # Builds the shared binaries image used by the package-only Dockerfiles.
  #
  # This is the single Rust compilation pass for the deployable service/client
  # images. The downstream jobs only assemble runtime layers around it.
  ############################################################################
  kms-binaries:
    name: docker-build/kms-binaries-secure (bpr)
    needs:
      - golden-image-tag
      - golden-image-latest
    if: |
      !cancelled() &&
      needs.golden-image-latest.result == 'success' &&
      (
        github.event_name != 'workflow_dispatch' ||
        inputs.build-core-client ||
        inputs.build-core-service
      )
    uses: zama-ai/ci-templates/.github/workflows/common-docker.yml@d13c806c229167a30eab20c228b87467d0e2e470 # v1.0.12
    permissions:
      actions: read # Required to read workflow run information
      contents: read # Required to checkout repository code
      id-token: write # Required for OIDC authentication
      pull-requests: read # Required to read pull request information
      packages: write # Required to publish Docker images
      attestations: write # Required to create build attestations
    with:
      # Compilation happens in this shared image. Release tags use fat LTO;
      # all other published images use thin LTO for faster CI links.
      lto-release: ${{ github.event_name == 'release' && 'release' || 'release-lto-thin' }}
      docker-file: './docker/kms-binaries/Dockerfile'
      working-directory: './docker/kms-binaries'
      image-name: 'kms/kms-binaries'
      push_image: true
      app-cache-dir: 'kms-binaries'
      build-args: |
        KMS_FLAVOR=secure
        RUST_GOLDEN_IMAGE=ghcr.io/zama-ai/kms/rust-golden-image:${{ needs.golden-image-tag.outputs.golden_tag }}
      use-cgr-secrets: true
      runs-on-amd: "runs-on=${{ github.run_id }}/runner=64cpu-linux-x64/spot=false/volume=200gb/extras=s3-cache"
      rust-toolchain-file-path: rust-toolchain.toml
    secrets:
      BLOCKCHAIN_ACTIONS_TOKEN: ${{ secrets.BLOCKCHAIN_ACTIONS_TOKEN }}
      AWS_ACCESS_KEY_S3_USER: ${{ secrets.AWS_ACCESS_KEY_S3_USER }}
      AWS_SECRET_KEY_S3_USER: ${{ secrets.AWS_SECRET_KEY_S3_USER }}
      CGR_USERNAME: ${{ secrets.CGR_USERNAME }}
      CGR_PASSWORD: ${{ secrets.CGR_PASSWORD }}

  ############################################################################
  # Builds the shared insecure binaries image for test service/client images.
  ############################################################################
  kms-binaries-insecure:
    name: docker-build/kms-binaries-insecure (bpr)
    needs:
      - golden-image-tag
      - golden-image-latest
    if: |
      !cancelled() &&
      needs.golden-image-latest.result == 'success' &&
      (
        github.event_name != 'workflow_dispatch' ||
        inputs.build-core-client ||
        inputs.build-core-service
      )
    uses: zama-ai/ci-templates/.github/workflows/common-docker.yml@d13c806c229167a30eab20c228b87467d0e2e470 # v1.0.12
    permissions:
      actions: read # Required to read workflow run information
      contents: read # Required to checkout repository code
      id-token: write # Required for OIDC authentication
      pull-requests: read # Required to read pull request information
      packages: write # Required to publish Docker images
      attestations: write # Required to create build attestations
    with:
      lto-release: ${{ github.event_name == 'release' && 'release' || 'release-lto-off' }}
      docker-file: './docker/kms-binaries/Dockerfile'
      working-directory: './docker/kms-binaries'
      image-name: 'kms/kms-binaries-insecure'
      push_image: true
      app-cache-dir: 'kms-binaries-insecure'
      build-args: |
        KMS_FLAVOR=insecure
        RUST_GOLDEN_IMAGE=ghcr.io/zama-ai/kms/rust-golden-image:${{ needs.golden-image-tag.outputs.golden_tag }}
      use-cgr-secrets: true
      runs-on-amd: "runs-on=${{ github.run_id }}/runner=64cpu-linux-x64/spot=false/volume=200gb/extras=s3-cache"
      rust-toolchain-file-path: rust-toolchain.toml
    secrets:
      BLOCKCHAIN_ACTIONS_TOKEN: ${{ secrets.BLOCKCHAIN_ACTIONS_TOKEN }}
      AWS_ACCESS_KEY_S3_USER: ${{ secrets.AWS_ACCESS_KEY_S3_USER }}
      AWS_SECRET_KEY_S3_USER: ${{ secrets.AWS_SECRET_KEY_S3_USER }}
      CGR_USERNAME: ${{ secrets.CGR_USERNAME }}
      CGR_PASSWORD: ${{ secrets.CGR_PASSWORD }}

  ############################################################################
  # Builds Docker image for core-client
  #
  core-client:
    name: docker-build/core-client-secure (bpr)
    needs:
      - kms-binaries
    if: |
      !cancelled() &&
      needs.kms-binaries.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.build-core-client)
    uses: zama-ai/ci-templates/.github/workflows/common-docker.yml@d13c806c229167a30eab20c228b87467d0e2e470 # v1.0.12
    permissions:
      actions: read # Required to read workflow run information
      contents: read # Required to checkout repository code
      id-token: write # Required for OIDC authentication
      pull-requests: read # Required to read pull request information
      packages: write # Required to publish Docker images
      attestations: write # Required to create build attestations
    with:
      docker-file: './docker/core-client/Dockerfile'
      working-directory: './core-client'
      push_image: true
      image-name: 'kms/core-client'
      app-cache-dir: 'kms-core-client'
      image-tag: ${{ needs.kms-binaries.outputs.image_tag }}
      build-args: |
        EXPECTED_KMS_FLAVOR=secure
        KMS_BINARIES_IMAGE=${{ needs.kms-binaries.outputs.image }}
      use-cgr-secrets: true
      runs-on-amd: "runs-on=${{ github.run_id }}/runner=64cpu-linux-x64/spot=false/volume=200gb/extras=s3-cache"
      rust-toolchain-file-path: rust-toolchain.toml
    secrets:
      BLOCKCHAIN_ACTIONS_TOKEN: ${{ secrets.BLOCKCHAIN_ACTIONS_TOKEN }}
      AWS_ACCESS_KEY_S3_USER: ${{ secrets.AWS_ACCESS_KEY_S3_USER }}
      AWS_SECRET_KEY_S3_USER: ${{ secrets.AWS_SECRET_KEY_S3_USER }}
      CGR_USERNAME: ${{ secrets.CGR_USERNAME }}
      CGR_PASSWORD: ${{ secrets.CGR_PASSWORD }}

  core-client-insecure:
    name: docker-build/core-client-insecure (bpr)
    needs:
      - kms-binaries-insecure
    if: |
      !cancelled() &&
      needs.kms-binaries-insecure.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.build-core-client)
    uses: zama-ai/ci-templates/.github/workflows/common-docker.yml@d13c806c229167a30eab20c228b87467d0e2e470 # v1.0.12
    permissions:
      actions: read # Required to read workflow run information
      contents: read # Required to checkout repository code
      id-token: write # Required for OIDC authentication
      pull-requests: read # Required to read pull request information
      packages: write # Required to publish Docker images
      attestations: write # Required to create build attestations
    with:
      docker-file: './docker/core-client/Dockerfile'
      working-directory: './core-client'
      push_image: true
      image-name: 'kms/core-client-insecure'
      app-cache-dir: 'kms-core-client-insecure'
      image-tag: ${{ needs.kms-binaries-insecure.outputs.image_tag }}
      build-args: |
        EXPECTED_KMS_FLAVOR=insecure
        KMS_BINARIES_IMAGE=${{ needs.kms-binaries-insecure.outputs.image }}
      use-cgr-secrets: true
      runs-on-amd: "runs-on=${{ github.run_id }}/runner=64cpu-linux-x64/spot=false/volume=200gb/extras=s3-cache"
      rust-toolchain-file-path: rust-toolchain.toml
    secrets:
      BLOCKCHAIN_ACTIONS_TOKEN: ${{ secrets.BLOCKCHAIN_ACTIONS_TOKEN }}
      AWS_ACCESS_KEY_S3_USER: ${{ secrets.AWS_ACCESS_KEY_S3_USER }}
      AWS_SECRET_KEY_S3_USER: ${{ secrets.AWS_SECRET_KEY_S3_USER }}
      CGR_USERNAME: ${{ secrets.CGR_USERNAME }}
      CGR_PASSWORD: ${{ secrets.CGR_PASSWORD }}

  ############################################################################
  # Builds the core service Docker image
  #
  core-service:
    name: docker-build/core-service-secure (bpr)
    needs:
      - golden-image-tag
      - kms-binaries
    if: |
      !cancelled() &&
      needs.kms-binaries.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.build-core-service)
    uses: zama-ai/ci-templates/.github/workflows/common-docker.yml@d13c806c229167a30eab20c228b87467d0e2e470 # v1.0.12
    permissions:
      actions: read # Required to read workflow run information
      contents: read # Required to checkout repository code
      id-token: write # Required for OIDC authentication
      pull-requests: read # Required to read pull request information
      packages: write # Required to publish Docker images
      attestations: write # Required to create build attestations
    with:
      docker-file: './docker/core/service/Dockerfile'
      working-directory: './core/service'
      push_image: true
      image-name: 'kms/core-service'
      app-cache-dir: 'kms'
      image-tag: ${{ needs.kms-binaries.outputs.image_tag }}
      build-args: |
        EXPECTED_KMS_FLAVOR=secure
        KMS_BINARIES_IMAGE=${{ needs.kms-binaries.outputs.image }}
        RUST_GOLDEN_IMAGE=ghcr.io/zama-ai/kms/rust-golden-image:${{ needs.golden-image-tag.outputs.golden_tag }}
      use-cgr-secrets: true
      runs-on-amd: "runs-on=${{ github.run_id }}/runner=64cpu-linux-x64/spot=false/volume=200gb/extras=s3-cache"
      rust-toolchain-file-path: rust-toolchain.toml
    secrets:
      BLOCKCHAIN_ACTIONS_TOKEN: ${{ secrets.BLOCKCHAIN_ACTIONS_TOKEN }}
      AWS_ACCESS_KEY_S3_USER: ${{ secrets.AWS_ACCESS_KEY_S3_USER }}
      AWS_SECRET_KEY_S3_USER: ${{ secrets.AWS_SECRET_KEY_S3_USER }}
      CGR_USERNAME: ${{ secrets.CGR_USERNAME }}
      CGR_PASSWORD: ${{ secrets.CGR_PASSWORD }}

  core-service-insecure:
    name: docker-build/core-service-insecure (bpr)
    needs:
      - golden-image-tag
      - kms-binaries-insecure
    if: |
      !cancelled() &&
      needs.kms-binaries-insecure.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.build-core-service)
    uses: zama-ai/ci-templates/.github/workflows/common-docker.yml@d13c806c229167a30eab20c228b87467d0e2e470 # v1.0.12
    permissions:
      actions: read # Required to read workflow run information
      contents: read # Required to checkout repository code
      id-token: write # Required for OIDC authentication
      pull-requests: read # Required to read pull request information
      packages: write # Required to publish Docker images
      attestations: write # Required to create build attestations
    with:
      docker-file: './docker/core/service/Dockerfile'
      working-directory: './core/service'
      push_image: true
      image-name: 'kms/core-service-insecure'
      app-cache-dir: 'kms-insecure'
      image-tag: ${{ needs.kms-binaries-insecure.outputs.image_tag }}
      build-args: |
        EXPECTED_KMS_FLAVOR=insecure
        KMS_BINARIES_IMAGE=${{ needs.kms-binaries-insecure.outputs.image }}
        RUST_GOLDEN_IMAGE=ghcr.io/zama-ai/kms/rust-golden-image:${{ needs.golden-image-tag.outputs.golden_tag }}
      use-cgr-secrets: true
      runs-on-amd: "runs-on=${{ github.run_id }}/runner=64cpu-linux-x64/spot=false/volume=200gb/extras=s3-cache"
      rust-toolchain-file-path: rust-toolchain.toml
    secrets:
      BLOCKCHAIN_ACTIONS_TOKEN: ${{ secrets.BLOCKCHAIN_ACTIONS_TOKEN }}
      AWS_ACCESS_KEY_S3_USER: ${{ secrets.AWS_ACCESS_KEY_S3_USER }}
      AWS_SECRET_KEY_S3_USER: ${{ secrets.AWS_SECRET_KEY_S3_USER }}
      CGR_USERNAME: ${{ secrets.CGR_USERNAME }}
      CGR_PASSWORD: ${{ secrets.CGR_PASSWORD }}

  ############################################################################
  # Builds AWS Nitro Enclave image for secure execution
  #
  enclave:
    name: docker-build/core-service-enclave-secure (bpr)
    needs:
      - core-service
    if: |
      !cancelled() &&
      needs.core-service.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.build-enclave)
    uses: ./.github/workflows/common-nitro-enclave.yml
    permissions:
      actions: read # Required to read workflow run information
      contents: write # Required to publish packages
      id-token: write # Required for OIDC token generation
      pull-requests: read # Required to read pull request information
      packages: write # Required to publish packages
      attestations: write # Required to write attestations
    with:
      docker-file-enclave: './docker/core/service/enclave.dockerfile'
      working-directory: './core/service'
      push_image: true
      image-name: 'kms/core-service'
      image-enclave-name: 'kms/core-service-enclave'
      image-tag: ${{ needs.core-service.outputs.image_tag }}
      eif-info-name: 'eif-info-secure.txt'
    secrets:
      BLOCKCHAIN_ACTIONS_TOKEN: ${{ secrets.BLOCKCHAIN_ACTIONS_TOKEN }}
      CGR_USERNAME: ${{ secrets.CGR_USERNAME }}
      CGR_PASSWORD: ${{ secrets.CGR_PASSWORD }}

  enclave-insecure:
    name: docker-build/core-service-enclave-insecure (bpr)
    needs:
      - core-service-insecure
    if: |
      !cancelled() &&
      needs.core-service-insecure.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.build-enclave)
    uses: ./.github/workflows/common-nitro-enclave.yml
    permissions:
      actions: read # Required to read workflow run information
      contents: write # Required to publish packages
      id-token: write # Required for OIDC token generation
      pull-requests: read # Required to read pull request information
      packages: write # Required to publish packages
      attestations: write # Required to write attestations
    with:
      docker-file-enclave: './docker/core/service/enclave.dockerfile'
      working-directory: './core/service'
      push_image: true
      image-name: 'kms/core-service-insecure'
      image-enclave-name: 'kms/core-service-enclave-insecure'
      image-tag: ${{ needs.core-service-insecure.outputs.image_tag }}
      eif-info-name: 'eif-info-insecure.txt'
    secrets:
      BLOCKCHAIN_ACTIONS_TOKEN: ${{ secrets.BLOCKCHAIN_ACTIONS_TOKEN }}
      CGR_USERNAME: ${{ secrets.CGR_USERNAME }}
      CGR_PASSWORD: ${{ secrets.CGR_PASSWORD }}
