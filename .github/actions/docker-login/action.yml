name: Docker Login
description: Login to a container registry with retry on transient timeouts

inputs:
  registry:
    description: Container registry hostname
    required: true
  username:
    description: Registry username
    required: true
  password:
    description: Registry password or token
    required: true

runs:
  using: composite
  steps:
    - name: Login to registry
      uses: zama-ai/ci-templates/.github/actions/retry@d13c806c229167a30eab20c228b87467d0e2e470 # v1.0.12
      env:
        REGISTRY: ${{ inputs.registry }}
        USERNAME: ${{ inputs.username }}
        PASSWORD: ${{ inputs.password }}
      with:
        command: |
          echo "$PASSWORD" | docker login "$REGISTRY" -u "$USERNAME" --password-stdin
