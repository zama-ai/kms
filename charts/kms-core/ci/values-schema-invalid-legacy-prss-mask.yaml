# Isolates misplaced nesting: the required sibling block is present, so
# rejection must come from tls.additionalProperties (not a missing sibling).
kmsCore:
  thresholdMode:
    enabled: true
    legacyPrssMask:
      beforePublicDecryptId: "0x01000000000000000000000000000000000000000000000000000000000c1cd1"
      beforeUserDecryptId: "0x0200000000000000000000000000000000000000000000000000000000171249"
    tls:
      enabled: true
      legacyPrssMask:
        beforePublicDecryptId: "0x01000000000000000000000000000000000000000000000000000000000c1cd1"
        beforeUserDecryptId: "0x0200000000000000000000000000000000000000000000000000000000171249"
