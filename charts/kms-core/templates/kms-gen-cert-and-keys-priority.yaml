{{- if and .Values.kmsGenCertAndKeys.enabled .Values.kmsCore.nitroEnclave.enabled -}}
{{- $priorityClassName := include "kmsGenCertAndKeysPriorityClassName" . }}
{{- /*
Do not set helm.sh/hook-delete-policy. before-hook-creation makes Helm DELETE
the class before creating it, and the deployer often cannot delete cluster-scoped
PriorityClasses. Skip the manifest when the class is already in the cluster so
a retry or upgrade does not try to create it again.
*/}}
{{- if not (lookup "scheduling.k8s.io/v1" "PriorityClass" "" $priorityClassName) }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ $priorityClassName }}
  labels:
    app: kms-core-gen-cert-and-keys
    app.kubernetes.io/name: {{ $priorityClassName }}
  annotations:
    {{- /*
    The cert-and-keys job is a pre-install/pre-upgrade hook at weight -1.
    This class must exist before that pod is admitted. The pod copies the
    integer priority at admission, so the class can stay after the hook.
    */}}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
description: Preempt the KMS core pod so the cert-and-keys job can take its Nitro enclave slot.
preemptionPolicy: PreemptLowerPriority
value: 1000000
globalDefault: false
{{- end }}
{{- end -}}
